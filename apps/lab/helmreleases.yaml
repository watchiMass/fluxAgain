apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-http
  namespace: lab-demo
spec:
  interval: 5m
  chart:
    kind: HelmChart
    spec:
      chart: podinfo
      version: "6.x"
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: podinfo-http
  values:
    replicaCount: 1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-oci
  namespace: lab-demo
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      ref:
        semver: "6.5.*"
  values:
    replicaCount: 1